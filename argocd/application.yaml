apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/johnsyweb/freo.git
    targetRevision: main
    path: charts/freo
  destination:
    server: https://kubernetes.default.svc
    namespace: freo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
