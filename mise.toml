min_version = "2025.8.0"

[tools]
python = "3.14"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.bootstrap]
description = "Install Python dependencies into the virtualenv"
run = "python -m pip install -r requirements.txt pytest"

[tasks.test]
description = "Run the test suite"
depends = ["bootstrap"]
run = "pytest"

[tasks.local]
description = "Run the app locally"
depends = ["bootstrap"]
run = "python app.py"
raw = true

[tasks.build]
description = "Build the Docker image"
run = "docker build -t freo:local ."

[tasks.docker]
description = "Run the app in Docker"
depends = ["build"]
run = "docker run --rm -p 8080:8080 freo:local"
raw = true
